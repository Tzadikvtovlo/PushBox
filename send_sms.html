lass="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> אנשי קשר
      </button>
      <button id="navFilters" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg> מסננים
      </button>
    </div>

    <div class="form-group">
      <label for="smsTo">נמען (מספר או בחר מתוך הרשימה):</label>
      <input type="text" id="smsTo" list="contactsDataList" placeholder="הזן מספר יעד...">
      <datalist id="contactsDataList"></datalist>
    </div>

    <div class="form-group flex-grow">
      <label for="smsBody">תוכן ההודעה:</label>
      <textarea id="smsBody" placeholder="הקלד כאן את תוכן ההודעה..."></textarea>
    </div>
    
    <button id="sendBtn" class="btn-send">
      <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      שלח הודעה
    </button>

    <div id="feedbackMsg"></div>
  </div>
  <script src="send_sms.js"></script>
</body>
</html>
