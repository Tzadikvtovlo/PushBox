<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הגדרות תוסף - PushBox</title>
  <script src="chrome-polyfill.js"></script>
  <style>
    :root {
      --primary: #1e3a8a; 
      --primary-hover: #1e40af;
      --bg: #faf5ff; 
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff; 
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      direction: rtl;
      margin: 0;
    }

    .container {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      max-width: 460px;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.05), 0 8px 10px -6px rgba(107, 33, 168, 0.02);
      border: 1px solid var(--border);
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 14px;
    }

    .header-logo {
      text-align: right;
    }

    .header-title {
      text-align: center;
      margin: 0;
      color: var(--primary);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .version-box {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: #f3e8ff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #d8b4fe;
      display: inline-block;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .version-box:hover {
      background: #e9d5ff;
      border-color: #c084fc;
    }
    
    .version-box.update {
      color: #ffffff;
      background: #6b21a8;
      border-color: #581c87;
      animation: pulse-purple 2s infinite;
    }

    .beta-badge {
      font-size: 11px;
      font-weight: 700;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 2px 7px;
      margin-right: 6px;
      vertical-align: middle;
      display: inline-block;
      letter-spacing: normal;
    }

    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: #faf5ff;
      color: var(--text);
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #c084fc;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
    }

    input[readonly] {
      background-color: #f3e8ff; 
      border-color: #d8b4fe;
      color: #581c87;
      cursor: default;
      text-align: center;
      font-weight: 800;
      letter-spacing: 1px;
    }

    input[readonly]:focus {
      box-shadow: none;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    button {
      flex: 1 1 45%;
      border: none;
      padding: 11px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-secondary {
      background: #f3e8ff;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e9d5ff;
      color: #1e3a8a;
      border-color: #c084fc;
    }

    .svg-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .email-copy {
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      direction: ltr;
      display: inline-block;
    }

    .email-copy:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="header">
      <div class="header-logo">
        <img src="icon48.png" alt="לוגו" style="width: 26px; height: 26px; object-fit: contain; vertical-align: middle;">
      </div>
      <h2 class="header-title">PushBox <span class="beta-badge">בטא</span></h2>
      <div style="text-align: left;">
        <span id="versionBox" class="version-box" title="לחץ לבדיקת עדכונים">טוען...</span>
      </div>
    </div>
    
    <div class="form-group">
      <label for="token">טוקן התחברות (Token):</label>
      <input type="text" id="token" placeholder="הכנס טוקן מערכת כאן">
    </div>

    <div class="form-group">
      <label for="phoneNumber">מספר הטלפון של המערכת:</label>
      <input type="text" id="phoneNumber" placeholder="ישלף אוטומטית מהמערכת..." readonly title="מספר זה מעודכן אוטומטית בהתאם לטוקן">
    </div>
    
    <div class="form-group">
      <label for="interval">תדירות בדיקה אוטומטית ברקע:</label>
      <select id="interval">
        <option value="0">ללא בדיקה אוטומטית (ידני בלבד)</option>
        <option value="1">כל דקה</option>
        <option value="5">כל 5 דקות</option>
        <option value="15">כל 15 דקות</option>
        <option value="30">כל 30 דקות</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notificationStyle">התראות עבור הודעות חדשות:</label>
      <select id="notificationStyle">
        <option value="both">חלון קופץ (Push) וסמל התוסף</option>
        <option value="push">חלון קופץ (Push)</option>
        <option value="badge">עדכון בסמל התוסף</option>
      </select>
    </div>

    <div class="form-group" style="background: #fdf4ff; border: 1px solid #e9d5ff; border-radius: 8px; padding: 12px; margin-bottom: 20px;">
      <label for="checkBetaUpdates" style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 0; font-weight: 600; color: #581c87;">
        <input type="checkbox" id="checkBetaUpdates" style="width: auto; margin: 0; cursor: pointer;">
        <span>קבלת התראות על גרסאות בטא (Beta / Pre-release)</span>
      </label>
      <div style="font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4;">
        כאשר אפשרות זו כבויה (ברירת מחדל), התוסף לא יתריע על גרסאות בטא, אלא רק על גרסאות סופיות יציבות לכולם.
      </div>
    </div>
    
    <div class="btn-group">
      <button id="verifyToken" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> אמת טוקן
      </button>
      <button id="save" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> שמור
      </button>
      <button id="manageFilters" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg> מסננים
      </button>
      <button id="resendNow" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> שלח
      </button>
    </div>

    <div class="footer">
      <div>כל הזכויות שמורות</div>
      <div><a href="https://github.com/Tzadikvtovlo" target="_blank">צדיק וטוב לו</a></div>
      <div><span class="email-copy" id="copyEmail" title="לחץ להעתקת המייל ללוח">q9411aa@gmail.com</span></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
