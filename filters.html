<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ניהול מסננים - PushBox</title>
  <script src="chrome-polyfill.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a; 
      --purple-main: #6b21a8;
      --purple-hover: #581c87;
      --bg: #faf5ff; 
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff; 
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      direction: rtl;
      margin: 0;
    }

    .container {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      max-width: 460px;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.05), 0 8px 10px -6px rgba(107, 33, 168, 0.02);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 14px;
    }

    .header-title {
      margin: 0;
      color: var(--primary); 
      font-family: 'Heebo', sans-serif; /* הוספת הגופן Heebo */
      font-size: 24px; 
      font-weight: 800; /* Extra Bold */
      letter-spacing: 0.5px;
      flex: 1;
      text-align: center;
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: #faf5ff;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: #c084fc;
      background-color: #fff;
    }

    .btn-add {
      background: #f3e8ff; 
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .btn-add:hover { 
      background: #e9d5ff;
      color: #1e3a8a;
      border-color: #c084fc;
    }

    .filters-list {
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .filter-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f3e8ff;
      border: 1px solid #d8b4fe;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .filter-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--purple-hover);
    }

    /* כפתור המחיקה - שונה מאדום לסגול נוכח */
    .btn-delete {
      background: #f3e8ff;
      color: var(--purple-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    
    .btn-delete:hover { 
      background: #e9d5ff; 
      border-color: #c084fc;
    }
    
    .svg-icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon48.png" alt="לוגו" style="width: 28px; height: 28px; object-fit: contain;">
      <h2 class="header-title">ניהול מסננים</h2>
      <svg class="svg-icon" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke: var(--purple-main);"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    </div>

    <div class="form-group">
      <label>אל תציג הודעות:</label>
      <select id="filterType">
        <option value="sender">מאת</option>
        <option value="contains">המכילות</option>
        <option value="not_contains">שאינן מכילות</option>
      </select>
    </div>
    <div class="form-group">
      <label id="valueLabel">השולח:</label>
      <input type="text" id="filterValue" placeholder="הזן כאן...">
    </div>
    <button id="addFilterBtn" class="btn-add">
      <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      הוסף כלל סינון
    </button>

    <div class="filters-list">
      <h3 style="font-size: 15px; color: var(--purple-main); margin-top: 0;">מסננים פעילים:</h3>
      <div id="filtersContainer">
        <!-- מסננים יוצגו כאן (יקבלו את העיצוב הסגול מה-CSS) -->
      </div>
    </div>
  </div>
  <script src="filters.js"></script>
</body>
</html>
