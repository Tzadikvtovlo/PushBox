name: צור Release לגרסה האחרונה

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and bump if exists
        id: version_logic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          
          # בדיקה מול עמוד ה-Releases בגיטהאב האם השחרור כבר קיים
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "הגרסה v$VERSION כבר קיימת בעמוד ההורדות. מעלה את המספר ב-0.01..."
            
            NEW_VERSION=$(awk "BEGIN {printf \"%.2f\", $VERSION + 0.01}")
            echo "הגרסה החדשה היא: $NEW_VERSION"
            
            jq ".version = \"$NEW_VERSION\"" manifest.json > tmp.json && mv tmp.json manifest.json
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git add manifest.json
            git commit -m "Auto-bump version to $NEW_VERSION [skip ci]"
            git push
            
            VERSION=$NEW_VERSION
          else
            echo "לא קיים שחרור v$VERSION בעמוד ההורדות. משתמש בגרסה הנוכחית."
          fi
          
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=PushBox v$VERSION.zip" >> $GITHUB_OUTPUT
          
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "COMMIT_MSG<<$EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Extension ZIP
        run: |
          ZIP_NAME="${{ steps.version_logic.outputs.ZIP_NAME }}"
          zip -r "$ZIP_NAME" . -x "README.md" -x "readme.md" -x ".github/*" -x ".git/*" -x "$ZIP_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_logic.outputs.TAG_NAME }}
          name: "PushBox ${{ steps.version_logic.outputs.TAG_NAME }}"
          body: |
            <div dir="rtl">

            > ${{ steps.version_logic.outputs.COMMIT_MSG }}

            ### הוראות התקנה:
            **התקנה חדשה:** 
            חילוץ התיקיה, הצבה שלה במקום שלא ימחק במחשב - וגרירה לעמוד התוספים בגוגל [chrome://extensions/](chrome://extensions/) (כאשר 'מצב פיתוח' מאושר).

            **עדכון תוסף מותקן:** 
            חילוץ הקבצים, והדבקתם בתיקית התוסף, תוך דריסה של הקיימים. ולאחמ"כ לחיצה על רענון בסמל התוסף בעמוד התוספים, או סגירה ופתיחה מחדש של הדפדפן.

            </div>
          files: ${{ steps.version_logic.outputs.ZIP_NAME }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
