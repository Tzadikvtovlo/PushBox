name: צור Release לגרסה האחרונה

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_logic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # קריאת שם התוסף ומספר הגרסה מתוך המניפסט (ללא שינוי הקובץ)
          EXT_NAME=$(jq -r '.name' manifest.json)
          BASE_VERSION=$(jq -r '.version' manifest.json)
          
          echo "שם התוסף שנמצא: $EXT_NAME"
          echo "גרסת הבסיס במניפסט: $BASE_VERSION"
          
          # הגדרת משתנה הגרסה לשימוש באריזה
          VERSION=$BASE_VERSION
          
          # בדיקה האם הגרסה כבר קיימת בעמוד ההורדות ב-GitHub
          if gh release view "v$BASE_VERSION" >/dev/null 2>&1; then
            echo "הגרסה v$BASE_VERSION כבר קיימת בהורדות."
            # חישוב הגרסה החדשה רק עבור שם הקובץ והשחרור (ללא נגיעה במניפסט)
            VERSION=$(awk "BEGIN {printf \"%.2f\", $BASE_VERSION + 0.01}")
            echo "מחשב גרסה חדשה לאריזה: $VERSION"
          else
            echo "הגרסה לא קיימת בהורדות. ממשיך עם גרסת הבסיס."
          fi
          
          # יצירת שם הקובץ (שם התוסף + v + גרסה)
          ZIP_NAME="${EXT_NAME} v${VERSION}.zip"
          
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          
          # שליפת הודעת התיעוד מהקומיט האחרון
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "COMMIT_MSG<<$EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Extension ZIP
        run: |
          ZIP_NAME="${{ steps.version_logic.outputs.ZIP_NAME }}"
          
          # אריזת הקבצים, החרגת קבצי מערכת, תיעוד, וקובץ הזיפ עצמו
          zip -r "$ZIP_NAME" . -x "README.md" -x "readme.md" -x ".github/*" -x ".git/*" -x "*.zip"
          
          echo "נארז בהצלחה: $ZIP_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_logic.outputs.TAG_NAME }}
          name: "גרסה ${{ steps.version_logic.outputs.TAG_NAME }}"
          body: |
            <div dir="rtl">

            > ${{ steps.version_logic.outputs.COMMIT_MSG }}

            ### הוראות התקנה:
            **התקנה חדשה:** 
            חילוץ התיקיה, הצבה שלה במקום שלא ימחק במחשב - וגרירה לעמוד התוספים בגוגל [chrome://extensions/](chrome://extensions/) (כאשר 'מצב פיתוח' מאושר).

            **עדכון תוסף מותקן:** 
            חילוץ הקבצים, והדבקתם בתיקית התוסף, תוך דריסה של הקיימים. ולאחמ"כ לחיצה על רענון בסמל התוסף בעמוד התוספים, או סגירה ופתיחה מחדש של הדפדפן.

            </div>
          files: "*.zip"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
