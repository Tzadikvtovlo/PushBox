name: Create Release ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # חובה כדי להביא את ההיסטוריה ואת כל התגיות

      # חישוב הגרסה הסופית כולל בדיקת כפילויות והוספת תת-גרסה במידת הצורך
      - name: Determine Release Version
        id: get_version
        run: |
          BASE_VERSION=$(jq -r '.version' manifest.json)
          echo "Base version from manifest: $BASE_VERSION"

          # בדיקה אם התגית הבסיסית כבר קיימת
          if git show-ref --tags "refs/tags/v$BASE_VERSION" --quiet; then
            echo "Tag v$BASE_VERSION exists. Finding next available sub-version..."
            
            # חיפוש תגיות קיימות עם תת-גרסה (למשל v4.0.0.1, v4.0.0.2) והבאת הגבוהה ביותר
            SAFE_BASE=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
            LATEST_SUB=$(git tag | grep -E "^v${SAFE_BASE}\.[0-9]+$" | sort -V | tail -n 1)

            if [ -z "$LATEST_SUB" ]; then
              FINAL_VERSION="${BASE_VERSION}.1"
            else
              SUB_NUM=$(echo "$LATEST_SUB" | awk -F. '{print $NF}')
              NEXT_SUB=$((SUB_NUM + 1))
              FINAL_VERSION="${BASE_VERSION}.${NEXT_SUB}"
            fi
          else
            FINAL_VERSION="$BASE_VERSION"
          fi
          
          echo "FINAL_VERSION=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: v$FINAL_VERSION"

      # חילוץ הודעת הקומיט שבו שונה ה-manifest
      - name: Extract Release Notes
        id: get_notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%B" -- manifest.json)
          
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="עדכון גרסה חדשה"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "RELEASE_NOTES<<$EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # יצירת קובץ ZIP בשם הפרויקט (קבצי הגרסה הרגילה)
      - name: Create ZIP archive
        run: |
          zip -r "${{ github.event.repository.name }}.zip" . -x "*.git*" "beta/*" "server.js" "chrome-polyfill.js" "index.html" "package.json" "bun.lock" "metadata.json" "node_modules/*" "*.bat" "*.sh"

      # יצירת ה-Release ב-GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "v${{ steps.get_version.outputs.FINAL_VERSION }}"
          name: "Release v${{ steps.get_version.outputs.FINAL_VERSION }}"
          body: "${{ env.RELEASE_NOTES }}"
          files: "${{ github.event.repository.name }}.zip"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
