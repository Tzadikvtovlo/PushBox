<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הודעות SMS - ימות המשיח</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --purple-main: #6b21a8;
      --bg: #faf5ff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      width: 380px;
      height: 560px; 
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .logo-container { text-align: right; }
    .app-icon { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; }

    .app-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .system-phone-container {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    #systemPhone { direction: ltr; display: inline-block; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto auto;
      gap: 6px;
      width: 100%;
    }

    .actions-row-2 {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      min-width: 0;
    }
    .search-input:focus { 
      border-color: #c084fc; 
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .icon-btn:hover, .icon-btn.active {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .btn-square { width: 34px; height: 34px; padding: 0; flex-shrink: 0; }

    .svg-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(-360deg); } }

    #trashHeader {
      display: none;
      text-align: center;
      color: #6b21a8;
      font-weight: 700;
      font-size: 12px;
      margin: 10px 0;
      background: #f3e8ff;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed #d8b4fe;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .update-alert-box {
      display: none;
      text-align: center;
      background: #6b21a8;
      color: white;
      padding: 8px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      animation: pulse-purple 2s infinite;
      flex-shrink: 0;
    }
    .update-alert-box:hover { background: #581c87; }

    #composePanel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08);
      flex: 1;
      flex-direction: column;
      gap: 8px;
    }
    .compose-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .compose-header span {
      font-weight: bold; color: var(--primary); font-size: 13px;
    }
    #openDedicatedSmsBtn {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; text-decoration: underline; font-size: 11px; padding: 0;
    }
    #openDedicatedSmsBtn:hover { color: var(--primary); }
    #composePanel input, #composePanel textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; background: #faf5ff;
    }
    #composePanel input:focus, #composePanel textarea:focus { border-color: #c084fc; background: #fff; }
    #composePanel textarea { resize: none; flex: 1; min-height: 100px; }
    .compose-actions { display: flex; gap: 8px; margin-top: auto; }
    .btn-send {
      flex: 1; background: #f3e8ff; color: var(--primary);
      border: 1px solid #d8b4fe; border-radius: 6px;
      padding: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s;
    }
    .btn-send:hover { background: #e9d5ff; }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      margin-top: 10px;
      position: relative;
    }
    #messagesList::-webkit-scrollbar { width: 5px; }
    #messagesList::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    .msg-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(107, 33, 168, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .msg-card:hover { box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08); }
    
    .msg-card.snoozed {
      background: #f8fafc; border-color: #e2e8f0;
    }
    .msg-card.snoozed .msg-body, 
    .msg-card.snoozed .msg-date-wrapper,
    .msg-card.snoozed .msg-source-wrapper {
      opacity: 0.5;
    }
    .msg-card.snoozed .snooze-action-btn {
      opacity: 1 !important;
      color: var(--purple-main);
      background: #f3e8ff;
    }

    .msg-header {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .msg-source-wrapper { text-align: right; }
    .msg-source {
      background: #f3e8ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }
    .msg-controls {
      display: flex;
      gap: 2px;
      justify-self: center;
    }
    .msg-date-wrapper { text-align: left; }
    .msg-date { font-size: 11px; }

    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 3px 5px; border-radius: 4px;
      transition: all 0.2s ease; opacity: 0.6;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:hover { background: #f3e8ff; color: var(--primary); opacity: 1; }

    .msg-body {
      font-size: 13px; color: var(--text); word-break: break-word;
      margin-bottom: 10px; line-height: 1.5;
    }
    .msg-body.collapsed {
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }

    .btn-copy {
      background: #f3e8ff; color: #1e3a8a; border: 1px solid #d8b4fe;
      padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-weight: 700; width: 100%; height: 34px; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box;
    }
    .btn-copy:hover { background: #e9d5ff; }
    .btn-copy .code-highlight { color: #6b21a8; font-weight: 800; }
    .copy-inner { display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* שכבת השהיית הודעה */
    .snooze-overlay {
      position: absolute;
      top: 36px; left: 10px; right: 10px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      border: 1px solid #c084fc;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      box-shadow: 0 6px 16px rgba(107, 33, 168, 0.12);
    }
    .snooze-actions { display: flex; width: 100%; gap: 6px; }
    .snooze-btn {
      flex: 1; background: #f3e8ff; border: 1px solid #d8b4fe;
      border-radius: 4px; font-size: 11px; padding: 8px 0; cursor: pointer;
      color: var(--purple-main); font-weight: bold; text-align: center; transition: background 0.2s;
    }
    .snooze-btn:hover { background: #e9d5ff; border-color: #c084fc; }
    
    .loading, .error, .empty {
      text-align: center; padding: 30px 15px; font-size: 13px;
      border-radius: var(--radius); border: 1px dashed var(--border); font-weight: 600;
    }
    .loading { color: var(--text-muted); background: var(--surface); }
    .error, .empty { color: #6b21a8; background: #f3e8ff; border-color: #d8b4fe; }
  </style>
</head>
<body>
  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <div class="header" id="mainHeader">
    <div class="top-bar">
      <div class="logo-container">
        <img src="icon48.png" alt="לוגו" class="app-icon">
      </div>
      <div class="app-title">PushBox</div>
      <div class="system-phone-container">
        <span id="systemPhone"></span>
      </div>
    </div>

    <div class="actions-grid">
      <button id="composeBtn" class="icon-btn" title="שלח SMS">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        שלח SMS
      </button>
      <button id="trashBtn" class="icon-btn" title="סל מחזור">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        מחזור
      </button>
      <a href="options.html" target="_blank" class="icon-btn btn-square" title="הגדרות">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
      <a href="contacts.html" target="_blank" class="icon-btn btn-square" title="אנשי קשר">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </a>
      <a href="filters.html" target="_blank" class="icon-btn btn-square" title="מסננים">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </a>
    </div>

    <div class="actions-row-2">
      <input type="text" id="searchInput" class="search-input" placeholder="חפש בהודעות...">
      <button id="toggleAllBtn" class="icon-btn btn-square" title="צמצם/הרחב הכל">
        <svg class="svg-icon toggle-all-icon" viewBox="0 0 24 24"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>
      </button>
      <button id="refreshBtn" class="icon-btn btn-square" title="רענן">
        <svg id="refreshIcon" class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </button>
      <button id="resendBtn" class="icon-btn btn-square" title="שלח התראת דחיפה להודעה האחרונה">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
    </div>
  </div>

  <div id="composePanel">
    <div class="compose-header">
      <span>שליחת הודעה חדשה</span>
      <button id="openDedicatedSmsBtn">חלון מלא</button>
    </div>
    <input type="text" id="smsTo" list="contactsDataList" placeholder="מספר נמען או בחר מרשימה..." autocomplete="off">
    <datalist id="contactsDataList"></datalist>
    <textarea id="smsBody" placeholder="תוכן ההודעה..."></textarea>
    <div class="compose-actions">
      <button id="sendSmsActionBtn" class="btn-send">שלח הודעה</button>
      <button id="cancelComposeBtn" class="btn-send" style="background:var(--surface); color:var(--text-muted); flex:0 0 80px;">חזור</button>
    </div>
  </div>

  <div id="trashHeader">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
    <span>סל מחזור פעיל (הודעות שנמחקו)</span>
  </div>

  <div id="messagesList">
    <div class="loading">טוען הודעות...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
