<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הודעות SMS - ימות המשיח</title>
  <script src="chrome-polyfill.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #faf5ff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      width: 380px;
      height: 560px; 
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .logo-container { text-align: right; }
    .app-icon { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; }

    .app-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .beta-badge {
      font-size: 11px;
      font-weight: 700;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 1px 6px;
      letter-spacing: normal;
      line-height: 1.3;
    }

    .system-phone-container {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    #systemPhone { direction: ltr; display: inline-block; }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-send-sms {
      background: #f3e8ff;
      color: #6b21a8;
      border-color: #d8b4fe;
      font-weight: 700;
    }
    .btn-send-sms:hover {
      background: #e9d5ff;
      color: #581c87;
    }

    .actions-row-2 {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .filter-tabs-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-top: 6px;
      scrollbar-width: none;
    }
    .filter-tabs-row::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .filter-pill:hover {
      background: #f3e8ff;
      color: var(--primary);
    }
    .filter-pill.active {
      background: #6b21a8;
      color: #ffffff;
      border-color: #6b21a8;
    }
    .pill-badge {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 1.4;
    }
    .filter-pill.active .pill-badge {
      background: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    /* Send SMS Panel */
    .send-sms-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(107, 33, 168, 0.08);
      animation: fadeIn 0.2s ease;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .section-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #f3e8ff;
      padding-bottom: 8px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
    }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
    }

    .form-group-sms {
      margin-bottom: 10px;
    }
    .form-group-sms label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .label-with-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .char-counter {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-group-sms input, .form-group-sms textarea {
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      font-size: 12px;
      outline: none;
      background: #faf5ff;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-group-sms input:focus, .form-group-sms textarea:focus {
      border-color: #c084fc;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.2);
    }

    .quick-templates {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .template-chip {
      background: #f3e8ff;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .template-chip:hover {
      background: #d8b4fe;
      color: #581c87;
    }

    .sms-status-banner {
      display: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .sms-status-banner.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .sms-status-banner.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .btn-primary-send {
      width: 100%;
      background: #6b21a8;
      color: #ffffff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary-send:hover {
      background: #581c87;
    }

    /* Milky Grayish styling for Snoozed / Read Later cards */
    .msg-card.snoozed {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%) !important;
      border: 1.5px dashed #cbd5e1 !important;
      border-right: 6px solid #94a3b8 !important;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.9), 0 2px 5px rgba(148, 163, 184, 0.12) !important;
      opacity: 0.92;
    }
    .msg-card.snoozed .msg-source {
      background: #e2e8f0;
      color: #475569;
    }
    .snooze-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      color: #475569;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .btn-wake-now {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      cursor: pointer;
      color: #334155;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-wake-now:hover {
      background: #f3e8ff;
      border-color: #c084fc;
      color: #6b21a8;
    }

    .search-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      min-width: 0;
    }
    .search-input:focus { 
      border-color: #c084fc; 
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      text-decoration: none;
      font-weight: 600;
      width: 100%;
    }

    .icon-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .btn-square { 
      width: 34px; 
      flex-shrink: 0; 
      padding: 7px 0; 
    }

    .btn-trash { 
      flex: 0 0 calc((100% - 12px) / 3); 
      width: calc((100% - 12px) / 3);
      padding: 7px 0; 
      flex-shrink: 0; 
    }

    .svg-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(-360deg); } }

    #trashHeader {
      display: none;
      text-align: center;
      color: #6b21a8;
      font-weight: 700;
      font-size: 12px;
      margin: 10px 0;
      background: #f3e8ff;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed #d8b4fe;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .update-alert-box {
      display: none;
      text-align: center;
      background: #6b21a8;
      color: white;
      padding: 8px;
      border-radius: var(--radius);
      margin: 10px 0 0 0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      animation: pulse-purple 2s infinite;
      flex-shrink: 0;
    }
    .update-alert-box:hover {
      background: #581c87;
    }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      margin-top: 10px;
    }
    #messagesList::-webkit-scrollbar { width: 5px; }
    #messagesList::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    .msg-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(107, 33, 168, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .msg-card:hover { box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08); }

    .msg-header {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .msg-source-wrapper { text-align: right; }
    .msg-source {
      background: #f3e8ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }
    .msg-controls {
      display: flex;
      gap: 4px;
      justify-self: center;
    }
    .msg-date-wrapper { text-align: left; }
    .msg-date { font-size: 11px; }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 3px 5px;
      border-radius: 4px;
      transition: all 0.2s ease;
      opacity: 0.6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #f3e8ff; color: var(--primary); opacity: 1; }

    .msg-body {
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .msg-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-copy {
      background: #f3e8ff;
      color: #1e3a8a;
      border: 1px solid #d8b4fe;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
      height: 34px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
    }
    .btn-copy:hover { background: #e9d5ff; }
    .btn-copy .code-highlight {
      color: #6b21a8;
      font-weight: 800;
    }
    .copy-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .loading, .error, .empty {
      text-align: center;
      padding: 30px 15px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      font-weight: 600;
    }
    .loading { color: var(--text-muted); background: var(--surface); }
    .error, .empty { color: #6b21a8; background: #f3e8ff; border-color: #d8b4fe; }
  </style>
</head>
<body>
  <div class="header">
    
    <div class="top-bar">
      <div class="logo-container">
        <img src="icon48.png" alt="לוגו" class="app-icon">
      </div>
      <div class="app-title">
        PushBox
        <span class="beta-badge">בטא</span>
      </div>
      <div class="system-phone-container">
        <span id="systemPhone"></span>
      </div>
    </div>

    <div class="actions-grid">
      <a href="options.html" target="_blank" class="icon-btn" title="הגדרות">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        הגדרות
      </a>
      <button id="refreshBtn" class="icon-btn" title="רענן הודעות">
        <svg id="refreshIcon" class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        רענן
      </button>
      <button id="openSendSmsBtn" class="icon-btn btn-send-sms" title="שליחת הודעת SMS">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        שלח SMS
      </button>
    </div>

    <div class="actions-row-2">
      <input type="text" id="searchInput" class="search-input" placeholder="חפש בהודעות...">
      <button id="toggleAllBtn" class="icon-btn btn-square" title="צמצם/הרחב הכל">
        <svg class="svg-icon toggle-all-icon" viewBox="0 0 24 24"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>
      </button>
      <button id="trashBtn" class="icon-btn btn-trash" title="סל מחזור (הודעות שנמחקו)">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        מחזור
      </button>
    </div>

    <!-- שורת לשוניות / פילטרים מהירים -->
    <div class="filter-tabs-row" id="filterTabsRow">
      <button class="filter-pill active" data-filter="all">הכל</button>
      <button class="filter-pill" data-filter="unread">
        לא נקראו <span id="unreadPillCount" class="pill-badge">0</span>
      </button>
      <button class="filter-pill" data-filter="snoozed">
        לקריאה בהמשך ⏰ <span id="snoozedPillCount" class="pill-badge">0</span>
      </button>
      <button class="filter-pill" data-filter="sent">
        נשלחו 📤
      </button>
    </div>

  </div>

  <div id="trashHeader">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
    <span>סל מחזור פעיל (הודעות שנמחקו)</span>
  </div>

  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <!-- מסך שליחת SMS -->
  <div id="sendSmsSection" class="send-sms-section" style="display: none;">
    <div class="section-title-bar">
      <button id="closeSendSmsBtn" class="back-btn" title="חזרה להודעות">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        חזרה
      </button>
      <span class="section-title">📤 שליחת הודעת SMS</span>
      <div style="width: 45px;"></div>
    </div>

    <form id="sendSmsForm">
      <div class="form-group-sms">
        <label for="smsRecipient">מספר נמען / טלפון:</label>
        <input type="tel" id="smsRecipient" placeholder="למשל: 0501234567" required dir="ltr">
      </div>

      <div class="form-group-sms">
        <label for="smsCallerId">מספר שולח מזוהה (Caller ID):</label>
        <input type="text" id="smsCallerId" placeholder="ברירת מחדל של המערכת" dir="ltr">
      </div>

      <div class="form-group-sms">
        <div class="label-with-meta">
          <label for="smsMessageText">תוכן ההודעה:</label>
          <span id="charCountLabel" class="char-counter">0 תווים (חלק 1)</span>
        </div>
        <textarea id="smsMessageText" rows="3" placeholder="הקלד כאן את תוכן ההודעה..." required></textarea>
      </div>

      <div class="quick-templates">
        <span class="template-chip" data-text="שלום, קיבלתי את הודעתך, תודה!">קיבלתי תודה</span>
        <span class="template-chip" data-text="אחזור אליך בהקדם האפשרי.">אחזור בהקדם</span>
        <span class="template-chip" data-text="קוד האימות התקבל בהצלחה.">קוד התקבל</span>
        <span class="template-chip" data-text="אנא צור קשר בהקדם.">נא ליצור קשר</span>
      </div>

      <div id="sendSmsStatus" class="sms-status-banner"></div>

      <button type="submit" id="submitSendSmsBtn" class="btn-primary-send">
        <span>🚀 שלח הודעת SMS</span>
      </button>
    </form>
  </div>

  <div id="messagesList">
    <div class="loading">טוען הודעות...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
