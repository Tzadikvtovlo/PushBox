<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הודעות - PushBox</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&display=swap');

    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --purple-main: #6b21a8;
      --bg: #faf5ff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      direction: rtl;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.05);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 80px);
    }

    /* התאמה לפאנל צד צר ולמסכים קטנים */
    @media (max-width: 450px) {
      body { padding: 15px 10px; }
      .container { padding: 20px 15px; height: calc(100vh - 30px); border-radius: 8px;}
    }

    .header {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 14px;
      flex-shrink: 0;
    }

    .header-title {
      margin: 0;
      color: var(--primary);
      font-family: 'Heebo', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .top-nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .top-nav-buttons button {
      border: none;
      padding: 11px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-secondary {
      background: #f3e8ff;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e9d5ff;
      color: var(--purple-main);
      border-color: #c084fc;
    }

    .actions-row-2 {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 6px;
      width: 100%;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: #faf5ff;
      outline: none;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .search-input:focus {
      border-color: #c084fc;
      background: #fff;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover, .icon-btn.active {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .svg-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(-360deg); } }

    #trashHeader {
      display: none;
      text-align: center;
      color: #6b21a8;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 15px;
      background: #f3e8ff;
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #d8b4fe;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      position: relative;
    }

    #messagesList::-webkit-scrollbar { width: 6px; }
    #messagesList::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    .msg-card {
      background: #faf5ff;
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .msg-card:hover {
      background: #ffffff;
      border-color: #d8b4fe;
      box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08);
    }

    .msg-card.snoozed { background: #f8fafc; border-color: #e2e8f0; }
    .msg-card.snoozed .msg-body, .msg-card.snoozed .msg-date-wrapper, .msg-card.snoozed .msg-source-wrapper { opacity: 0.5; }
    .msg-card.snoozed .snooze-action-btn { opacity: 1 !important; color: var(--purple-main); background: #f3e8ff; }

    .msg-header {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .msg-source-wrapper { text-align: right; }
    .msg-source {
      background: #e9d5ff;
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      display: inline-block;
    }

    .msg-controls { display: flex; gap: 4px; justify-self: center; }
    .msg-date-wrapper { text-align: left; }
    .msg-date { font-size: 12px; }

    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 4px; border-radius: 6px;
      transition: all 0.2s ease; opacity: 0.7;
      display: flex; align-items: center; justify-content: center;
    }

    .ctrl-btn:hover { background: #e9d5ff; color: var(--primary); opacity: 1; }

    .msg-body {
      font-size: 14px; color: var(--text); word-break: break-word;
      margin-bottom: 12px; line-height: 1.6;
    }
    .msg-body.collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .btn-copy {
      background: #ffffff; color: var(--primary); border: 1px solid var(--border);
      padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
      font-weight: 700; width: 100%; height: 38px; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-copy:hover { background: #f3e8ff; border-color: #c084fc; }
    .btn-copy .code-highlight { color: #6b21a8; font-weight: 800; font-size: 14px; }
    .copy-inner { display: flex; align-items: center; justify-content: center; gap: 6px; }

    .snooze-overlay {
      position: absolute; top: 45px; left: 14px; right: 14px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px);
      border: 1px solid #c084fc; border-radius: 8px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; z-index: 10;
      box-shadow: 0 6px 16px rgba(107, 33, 168, 0.12);
    }
    .snooze-actions { display: flex; width: 100%; gap: 6px; }
    .snooze-btn {
      flex: 1; background: #f3e8ff; border: 1px solid #d8b4fe;
      border-radius: 6px; font-size: 12px; padding: 10px 0; cursor: pointer;
      color: var(--purple-main); font-weight: bold; text-align: center; transition: all 0.2s;
    }
    .snooze-btn:hover { background: #e9d5ff; border-color: #c084fc; }

    .loading, .error, .empty {
      text-align: center; padding: 40px 20px; font-size: 14px;
      border-radius: 8px; border: 1px dashed var(--border); font-weight: 600;
    }
    .loading { color: var(--text-muted); background: var(--bg); }
    .error, .empty { color: #6b21a8; background: #f3e8ff; border-color: #d8b4fe; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div style="text-align: right; width: 28px;">
        <img src="icon/icon48.png" alt="לוגו" style="width: 28px; height: 28px; object-fit: contain; vertical-align: middle;">
      </div>
      <h2 class="header-title">הודעות</h2>
      <div style="text-align: left; width: 28px; display: flex; justify-content: flex-end; align-items: center;">
        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: var(--purple-main);"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
    </div>

    <!-- כפתורי ניווט לחלונית צד, מסודרים כעת בשורות יפות של 2 על 2 -->
    <div class="top-nav-buttons">
      <button id="navOptions" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> הגדרות
      </button>
      <button id="navContacts" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> אנשי קשר
      </button>
      <button id="navFilters" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg> מסננים
      </button>
      <button id="navSendSms" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> שלח SMS
      </button>
    </div>

    <!-- שורת פעולות (חיפוש ופחים) -->
    <div class="actions-row-2">
      <input type="text" id="searchInput" class="search-input" placeholder="חפש בהודעות...">
      <button id="trashBtn" class="icon-btn" title="סל מחזור">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
      <button id="toggleAllBtn" class="icon-btn" title="צמצם/הרחב הכל">
        <svg class="svg-icon toggle-all-icon" viewBox="0 0 24 24"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="רענן">
        <svg id="refreshIcon" class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </button>
      <button id="resendBtn" class="icon-btn" title="שלח התראת דחיפה להודעה האחרונה">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
    </div>

    <div id="trashHeader">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
      <span>סל מחזור פעיל (הודעות שנמחקו)</span>
    </div>

    <!-- רשימת הודעות -->
    <div id="messagesList">
      <div class="loading">טוען הודעות...</div>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
