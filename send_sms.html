<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>שליחת SMS - PushBox</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&display=swap');

    :root {
      --primary: #1e3a8a; 
      --purple-main: #6b21a8;
      --purple-hover: #581c87;
      --bg: #faf5ff; 
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e9d5ff; 
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; direction: rtl; margin: 0; }
    
    .container {
      background: var(--surface); padding: 30px; border-radius: var(--radius);
      max-width: 500px; width: 100%; margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.05); border: 1px solid var(--border);
    }
    
    .header { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--bg); padding-bottom: 14px; }
    .header-title { margin: 0; color: var(--primary); font-family: 'Heebo', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; text-align: center; }
    
    .update-alert-box {
      display: none; text-align: center; background: #6b21a8; color: white; padding: 10px;
      border-radius: var(--radius); margin: 0 auto 20px auto; max-width: 500px;
      font-weight: 700; font-size: 14px; cursor: pointer; animation: pulse-purple 2s infinite;
    }
    .update-alert-box:hover { background: #581c87; }
    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .top-nav-buttons { display: flex; gap: 8px; margin-bottom: 24px; }
    .top-nav-buttons button {
      flex: 1; border: none; padding: 11px 8px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: all 0.2s ease; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    }
    .btn-secondary { background: #f3e8ff; color: var(--primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e9d5ff; color: var(--purple-main); border-color: #c084fc; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
    input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background-color: #faf5ff; outline: none; transition: all 0.2s ease; font-family: inherit; }
    textarea { resize: vertical; min-height: 120px; }
    input:focus, textarea:focus { border-color: #c084fc; background-color: #fff; }
    
    .btn-send { background: #f3e8ff; color: var(--primary); border: 1px solid var(--border); padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; transition: all 0.2s ease; }
    .btn-send:hover { background: #e9d5ff; color: var(--purple-main); border-color: #c084fc; }
    
    /* תוקן: האייקון לא נחתך (flex-shrink: 0) */
    .svg-icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    
    #feedbackMsg { margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; display: none; padding: 10px; border-radius: 8px; }
    .success { background: #e9d5ff; color: #1e3a8a; border: 1px solid #c084fc; }
    .error { background: #fce7f3; color: #9f1239; border: 1px solid #fbcfe8; }
  </style>
</head>
<body>
  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <div class="container">
    <div class="header">
      <div style="text-align: right; width: 28px;">
        <img src="icon48.png" alt="לוגו" style="width: 28px; height: 28px; object-fit: contain; vertical-align: middle;">
      </div>
      <h2 class="header-title">שליחת הודעה</h2>
      <div style="text-align: left; width: 28px; display: flex; justify-content: flex-end; align-items: center;">
        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: var(--purple-main);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </div>
    </div>

    <div class="top-nav-buttons">
      <button id="navOptions" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> הגדרות
      </button>
      <button id="navContacts" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> אנשי קשר
      </button>
      <button id="navFilters" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg> מסננים
      </button>
    </div>

    <div class="form-group">
      <label for="smsTo">נמען (מספר או בחר מתוך הרשימה):</label>
      <input type="text" id="smsTo" list="contactsDataList" placeholder="הזן מספר יעד...">
      <datalist id="contactsDataList"></datalist>
    </div>

    <div class="form-group">
      <label for="smsBody">תוכן ההודעה:</label>
      <textarea id="smsBody" placeholder="הקלד כאן את תוכן ההודעה..."></textarea>
    </div>
    
    <button id="sendBtn" class="btn-send">
      <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      שלח הודעה
    </button>

    <div id="feedbackMsg"></div>
  </div>
  <script src="send_sms.js"></script>
</body>
</html>
