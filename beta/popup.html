<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הודעות SMS - PushBox (בטא 4.91)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #faf5ff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      width: 380px;
      height: 560px; 
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .logo-container { text-align: right; }
    .app-icon { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; }

    .app-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .beta-badge {
      font-size: 10px;
      font-weight: 700;
      color: #6b21a8;
      background: #f3e8ff;
      border: 1px solid #d8b4fe;
      padding: 1px 6px;
      border-radius: 6px;
      vertical-align: middle;
      display: inline-block;
    }

    .system-phone-container {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    #systemPhone { direction: ltr; display: inline-block; }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .actions-row-2 {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      min-width: 0;
    }
    .search-input:focus { 
      border-color: #c084fc; 
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      text-decoration: none;
      font-weight: 600;
      width: 100%;
    }

    .icon-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .btn-square { 
      width: 34px; 
      flex-shrink: 0; 
      padding: 7px 0; 
    }

    .btn-trash { 
      flex: 0 0 calc((100% - 12px) / 3); 
      width: calc((100% - 12px) / 3);
      padding: 7px 0; 
      flex-shrink: 0; 
    }

    /* שורת לשוניות / סינון - באותו קו עיצובי של 4.6 */
    .tabs-row {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .tab-chip {
      flex: 1;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 2px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-chip:hover {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .tab-chip.active {
      background: #f3e8ff;
      color: #1e3a8a;
      border-color: #c084fc;
      font-weight: 700;
    }

    .tab-counter {
      background: #e9d5ff;
      color: #6b21a8;
      font-size: 10px;
      padding: 0 4px;
      border-radius: 8px;
      font-weight: 800;
      display: none;
    }
    .tab-counter.visible {
      display: inline-block;
    }

    .svg-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(-360deg); } }

    #trashHeader {
      display: none;
      text-align: center;
      color: #6b21a8;
      font-weight: 700;
      font-size: 12px;
      margin: 8px 0 2px;
      background: #f3e8ff;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed #d8b4fe;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .update-alert-box {
      display: none;
      text-align: center;
      background: #6b21a8;
      color: white;
      padding: 8px;
      border-radius: var(--radius);
      margin: 8px 0 0 0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      animation: pulse-purple 2s infinite;
      flex-shrink: 0;
    }
    .update-alert-box:hover {
      background: #581c87;
    }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      margin-top: 8px;
    }
    #messagesList::-webkit-scrollbar { width: 5px; }
    #messagesList::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    /* כרטיסיית הודעה בעיצוב המקורי של 4.6 */
    .msg-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(107, 33, 168, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .msg-card:hover { box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08); }

    .msg-card.is-unread {
      border-color: #c084fc;
      box-shadow: 0 2px 8px rgba(107, 33, 168, 0.1);
    }

    .msg-header {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .msg-source-wrapper { 
      text-align: right; 
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .msg-source {
      background: #f3e8ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }

    .unread-dot {
      width: 7px;
      height: 7px;
      background: #6b21a8;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .snooze-tag {
      background: #fdf4ff;
      color: #9333ea;
      border: 1px solid #f0abfc;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .msg-controls {
      display: flex;
      gap: 3px;
      justify-self: center;
    }
    .msg-date-wrapper { text-align: left; }
    .msg-date { font-size: 11px; }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 3px 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
      opacity: 0.65;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #f3e8ff; color: var(--primary); opacity: 1; }
    .ctrl-btn.active { color: #6b21a8; opacity: 1; }

    .msg-body {
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .msg-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-copy {
      background: #f3e8ff;
      color: #1e3a8a;
      border: 1px solid #d8b4fe;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
      height: 34px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
    }
    .btn-copy:hover { background: #e9d5ff; }
    .btn-copy .code-highlight {
      color: #6b21a8;
      font-weight: 800;
    }
    .copy-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* תפריט Snooze שנפתח מעל הכרטיסייה */
    .snooze-popover {
      position: absolute;
      top: 36px;
      left: 14px;
      background: #ffffff;
      border: 1px solid #d8b4fe;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(107, 33, 168, 0.15);
      z-index: 50;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
    }
    .snooze-popover button {
      background: none;
      border: none;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      text-align: right;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.15s ease;
    }
    .snooze-popover button:hover {
      background: #f3e8ff;
      color: var(--primary);
    }
    .snooze-popover button.danger {
      color: #b91c1c;
    }

    /* חלונית שליחת SMS מובנית בעיצוב 4.6 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      width: 100%;
      max-height: 95%;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(107, 33, 168, 0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }
    .modal-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-row label {
      font-size: 11px;
      font-weight: 700;
      color: #334155;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #faf5ff;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: #c084fc;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }
    .form-textarea {
      resize: vertical;
      min-height: 70px;
    }

    .char-info {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .status-alert {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: none;
    }
    .status-alert.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-alert.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .status-alert.info {
      background: #f3e8ff;
      color: var(--primary);
      border: 1px solid #d8b4fe;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-submit-sms {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-submit-sms:hover {
      background: var(--primary-hover);
    }
    .btn-submit-sms:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading, .error, .empty {
      text-align: center;
      padding: 30px 15px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      font-weight: 600;
    }
    .loading { color: var(--text-muted); background: var(--surface); }
    .error, .empty { color: #6b21a8; background: #f3e8ff; border-color: #d8b4fe; }
  </style>
</head>
<body>
  <div class="header">
    
    <div class="top-bar">
      <div class="logo-container">
        <img src="icon48.png" alt="לוגו" class="app-icon">
      </div>
      <div class="app-title">
        PushBox <span class="beta-badge">4.91 בטא</span>
      </div>
      <div class="system-phone-container">
        <span id="systemPhone"></span>
      </div>
    </div>

    <!-- שורת פעולות ראשונה -->
    <div class="actions-grid">
      <a href="options.html" target="_blank" class="icon-btn" title="הגדרות">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        הגדרות
      </a>
      <button id="refreshBtn" class="icon-btn" title="רענן הודעות">
        <svg id="refreshIcon" class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        רענן
      </button>
      <button id="openSendSmsBtn" class="icon-btn" title="שליחת הודעת SMS חדשה">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        שלח SMS
      </button>
    </div>

    <!-- שורת פעולות שניה: חיפוש, צמצום וסל מחזור -->
    <div class="actions-row-2">
      <input type="text" id="searchInput" class="search-input" placeholder="חפש בהודעות...">
      <button id="toggleAllBtn" class="icon-btn btn-square" title="צמצם/הרחב הכל">
        <svg class="svg-icon toggle-all-icon" viewBox="0 0 24 24"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>
      </button>
      <button id="trashBtn" class="icon-btn btn-trash" title="סל מחזור (הודעות שנמחקו)">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        מחזור
      </button>
    </div>

    <!-- שורת לשוניות / סינון - באותו קו עיצובי -->
    <div class="tabs-row">
      <button class="tab-chip active" data-tab="all">הכל</button>
      <button class="tab-chip" data-tab="unread">לא נקראו <span id="unreadCountBadge" class="tab-counter"></span></button>
      <button class="tab-chip" data-tab="snoozed">בהמשך <span id="snoozedCountBadge" class="tab-counter"></span></button>
      <button class="tab-chip" data-tab="sent">נשלחו</button>
    </div>

  </div>

  <div id="trashHeader">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
    <span>סל מחזור פעיל (הודעות שנמחקו)</span>
    <button id="emptyTrashBtn" style="background: none; border: none; color: #b91c1c; font-size: 11px; font-weight: 700; text-decoration: underline; cursor: pointer; margin-right: auto;">רוקן הכל</button>
  </div>

  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <!-- רשימת ההודעות -->
  <div id="messagesList">
    <div class="loading">טוען הודעות...</div>
  </div>

  <!-- מודאל שליחת הודעת SMS -->
  <div id="sendSmsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">שליחת הודעת SMS</h3>
        <button id="closeSendSmsModal" class="modal-close-btn" title="סגור">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="form-row">
        <label for="smsRecipient">מספר נמען / נמענים:</label>
        <input type="text" id="smsRecipient" class="form-input" placeholder="0501234567 (ניתן להפריד בפסיקים)">
      </div>

      <div class="form-row">
        <label for="smsCallerId">מספר שולח (Caller ID):</label>
        <input type="text" id="smsCallerId" class="form-input" placeholder="ישלח ממספר המערכת כברירת מחדל">
      </div>

      <div class="form-row">
        <label for="smsMessageText">תוכן ההודעה:</label>
        <textarea id="smsMessageText" class="form-textarea" placeholder="הקלד כאן את תוכן ההודעה..."></textarea>
      </div>

      <div class="char-info">
        <span id="smsCharCounter">0 תווים | חלק 1 (עברית)</span>
        <button id="clearSmsTextBtn" style="background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;">נקה מלל</button>
      </div>

      <div id="sendSmsStatus" class="status-alert"></div>

      <div class="modal-buttons">
        <button id="cancelSendSmsBtn" class="icon-btn" style="width: 80px;">ביטול</button>
        <button id="submitSendSmsBtn" class="btn-submit-sms">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          שלח SMS
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
