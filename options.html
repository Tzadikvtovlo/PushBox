<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הגדרות תוסף - PushBox</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&display=swap');
    
    :root {
      --primary: #1e3a8a; 
      --purple-main: #6b21a8;
      --purple-hover: #581c87;
      --bg: #faf5ff; 
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff; 
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      direction: rtl;
      margin: 0;
    }

    .container {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.05), 0 8px 10px -6px rgba(107, 33, 168, 0.02);
      border: 1px solid var(--border);
    }

    .header {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 14px;
    }

    .header-title {
      margin: 0;
      color: var(--primary);
      font-family: 'Heebo', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .update-alert-box {
      display: none;
      text-align: center;
      background: #6b21a8;
      color: white;
      padding: 10px;
      border-radius: var(--radius);
      margin: 0 auto 20px auto;
      max-width: 500px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      animation: pulse-purple 2s infinite;
    }
    .update-alert-box:hover { background: #581c87; }
    
    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .form-group { margin-bottom: 20px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 20px; }
    
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
    input, select {
      width: 100%; padding: 11px 14px; box-sizing: border-box; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background-color: #faf5ff; color: var(--text);
      transition: all 0.2s ease; outline: none;
    }
    input:focus, select:focus { border-color: #c084fc; background-color: #fff; box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15); }
    input[readonly] { background-color: #f3e8ff; border-color: #d8b4fe; color: #581c87; cursor: default; text-align: center; font-weight: 800; letter-spacing: 1px; }

    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .top-nav-buttons { display: flex; gap: 8px; margin-bottom: 24px; }
    
    button {
      flex: 1; border: none; padding: 11px 8px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: all 0.2s ease; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    }
    .btn-secondary { background: #f3e8ff; color: var(--primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e9d5ff; color: var(--purple-main); border-color: #c084fc; }

    .svg-icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; overflow: visible; }

    .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.8; }
    .footer a { color: var(--primary); text-decoration: none; font-weight: bold; }
    .footer a:hover { text-decoration: underline; }
    .email-copy { color: var(--primary); font-weight: bold; cursor: pointer; direction: ltr; display: inline-block; }
    .email-copy:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <div class="container">
    <div class="header">
      <div style="text-align: right; width: 28px;">
        <img src="icon48.png" alt="לוגו" style="width: 28px; height: 28px; object-fit: contain; vertical-align: middle;">
      </div>
      <h2 class="header-title">הגדרות</h2>
      <div style="text-align: left; width: 28px; display: flex; justify-content: flex-end; align-items: center;">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke: var(--purple-main);"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>

    <!-- כפתורי ניווט עליונים - מציג רק דפים אחרים -->
    <div class="top-nav-buttons">
      <button id="navContacts" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> אנשי קשר
      </button>
      <button id="navFilters" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg> מסננים
      </button>
      <button id="navSendSms" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> שלח SMS
      </button>
    </div>
    
    <div class="form-group">
      <label for="token">טוקן התחברות (Token):</label>
      <input type="text" id="token" placeholder="הכנס טוקן מערכת כאן">
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 2; margin-bottom: 0;">
        <label for="phoneNumber">מספר המערכת:</label>
        <input type="text" id="phoneNumber" placeholder="ישלף אוטומטית..." readonly title="מספר זה מעודכן אוטומטית בהתאם לטוקן">
      </div>
      <div class="form-group" style="flex: 1; margin-bottom: 0;">
        <label for="installedVersion">גרסה מותקנת:</label>
        <input type="text" id="installedVersion" readonly style="direction: ltr; font-weight: bold; color: var(--purple-main);">
      </div>
    </div>
    
    <div class="form-group">
      <label for="interval">תדירות בדיקה אוטומטית ברקע:</label>
      <select id="interval">
        <option value="0">ללא בדיקה אוטומטית (ידני בלבד)</option>
        <option value="1">כל דקה</option>
        <option value="5">כל 5 דקות</option>
        <option value="15">כל 15 דקות</option>
        <option value="30">כל 30 דקות</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notificationStyle">התראות עבור הודעות חדשות:</label>
      <select id="notificationStyle">
        <option value="both">חלון קופץ (Push) וסמל התוסף</option>
        <option value="push">חלון קופץ (Push)</option>
        <option value="badge">עדכון בסמל התוסף</option>
      </select>
    </div>

    <div class="form-group">
      <label for="updateNotificationStyle">התראות עבור גרסה חדשה (עדכונים):</label>
      <select id="updateNotificationStyle">
        <option value="both">באנר בפופ-אפ וסמל התוסף</option>
        <option value="popup">באנר בפופ-אפ בלבד</option>
        <option value="badge">סמל התוסף בלבד</option>
        <option value="none">ללא התראות (רק בדף הגדרות)</option>
      </select>
    </div>
    
    <div class="btn-group">
      <button id="verifyToken" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> אמת טוקן
      </button>
      <button id="save" class="btn-secondary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> שמור
      </button>
    </div>

    <div class="footer">
      <div>כל הזכויות שמורות</div>
      <div><a href="https://github.com/Tzadikvtovlo" target="_blank">צדיק וטוב לו</a></div>
      <div><span class="email-copy" id="copyEmail" title="לחץ להעתקת המייל ללוח">q9411aa@gmail.com</span></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
